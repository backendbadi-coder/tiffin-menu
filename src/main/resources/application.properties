spring.application.name=tiffin-menu

# ---------- H2 in-memory database (resets on every restart) ----------
spring.datasource.url=jdbc:h2:mem:menudb
spring.datasource.username=sa
spring.datasource.password=
# Web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:menudb)
spring.h2.console.enabled=true

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Run data.sql after Hibernate has created the table
spring.jpa.defer-datasource-initialization=true

# ---------- Running behind a reverse proxy in production ----------
# Use X-Forwarded-* headers to build URLs. This property is deprecated in Spring Boot 4.2:
# the properties migrator will report it during the upgrade (see UPGRADE-4.1-to-4.2.md).
server.request.header.forwarded.strategy=framework

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Tiffin Menu API
info.app.spring-boot=4.2

# ---------- MCP server (Spring AI) ----------
spring.ai.mcp.server.name=tiffin-menu-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Tools for the Annapurna tiffin center menu. Prices are in Indian rupees. Use the read-only tools to answer questions; only add or change items when the user clearly asks.
# STREAMABLE is the default; written here so viewers can see it. Endpoint: POST /mcp
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC

# ---------- SAFETY for this demo ----------
# The MCP endpoint has NO authentication by default. Only accept connections from this computer.
server.address=127.0.0.1