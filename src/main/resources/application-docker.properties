# Used only when SPRING_PROFILES_ACTIVE=docker (set in compose.yaml).
# The datasource URL, username and password come from environment variables in compose.yaml.

# PostgreSQL keeps its data in a volume, so Hibernate must NOT drop/recreate the table.
# The table is created by docker/db/init.sql; Hibernate only checks that it matches the entity.
spring.jpa.hibernate.ddl-auto=validate

# Don't run data.sql against PostgreSQL (init.sql already inserts the sample menu once)
spring.sql.init.mode=never

# H2 console makes no sense with PostgreSQL
spring.h2.console.enabled=false
spring.jpa.show-sql=false

# Inside a container, listen on all interfaces so Docker port mapping works.
server.address=0.0.0.0